<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Doar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar admin-topbar">
  <a href="index.html" class="back-btn">←</a>
  <h1 class="logo">Fazer Doação</h1>
</header>

<body class="page-doar">
  
</body>
<div class="container">
  <form id="form" class="form-doacao">

    <label for="nome">Nome</label>
    <input id="nome" placeholder="Digite seu nome" required>

    <label for="telefone">Telefone</label>
    <input id="telefone" placeholder="(DDD) + número" required>

    <label>Tipo de doação</label>
    <div class="checkbox-group">
      <div id="pixBox" class="pix-box hidden">

        <p><strong>Chave PIX:</strong></p>
        <p class="pix-chave" id="pixChave">
          mvctbasocial@gmail.com
        </p>

        <label for="valorPix">Valor da doação</label>
        <input 
          type="text" 
          id="valorPix" 
          placeholder="Digite o valor da doação"
      >

    </div>  
      <label>
        <input type="checkbox" name="tipo" value="PIX" id="pixCheckbox">
        PIX
      </label>
      <label><input type="checkbox" name="tipo" value="Roupas"> Roupas</label>
      <label><input type="checkbox" name="tipo" value="Alimentos"> Alimentos</label>
      <label><input type="checkbox" name="tipo" value="Higiene"> Higiene</label>
      <label><input type="checkbox" name="tipo" value="Outros"> Outros</label>
    </div>

    <label for="descricao">Descrição</label>
    <textarea id="descricao" placeholder="Descreva a doação"></textarea>

    <label for="bairro">Bairro</label>
    <select id="bairro" required>
      <option value="">Selecione o bairro</option>
      <option>Água Verde</option>
      <option>Atuba</option>
      <option>Bacacheri</option>
      <option>Boqueirão</option>
      <option>Cajuru</option>
      <option>Centro</option>
      <option>CIC</option>
      <option>Fazendinha</option>
      <option>Hauer</option>
      <option>Juvevê</option>
      <option>Mercês</option>
      <option>Novo Mundo</option>
      <option>Pinheirinho</option>
      <option>Portão</option>
      <option>Rebouças</option>
      <option>Santa Felicidade</option>
      <option>Sítio Cercado</option>
      <option>Tatuquara</option>
      <option value="outro">Outro</option>
    </select>

    <input 
      id="bairroOutro" 
      placeholder="Digite seu bairro"
      class="hidden"
    >

    <label for="entregar">Você pode entregar a doação?</label>
    <select id="entregar" required>
      <option value="">Selecione uma opção</option>
      <option>Sim, posso entregar em algum ponto próximo</option>
      <option>Não, preciso que retirem comigo</option>
    </select>

    <button type="submit" class="btn">Enviar doação</button>

  </form>
</div>

<script src="script.js" type="module"></script>

</body>
</html>
